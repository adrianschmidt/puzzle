name: CI

on:
  pull_request:

# This job only checks out and runs npm, so read is all it needs — and it
# executes a good deal of third-party code (npm ci, oxlint's and vite's
# native bindings, vitest), which `actions/checkout` hands a token to via
# `persist-credentials`.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here runs a git operation, so the token this would
          # otherwise leave in .git/config is pure exposure — readable by
          # every npm binary the job goes on to execute.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Deliberately a step in this job rather than a job of its own. Required
      # status checks are named in the "Protect main" ruleset, not inferred
      # from workflow files (see dependabot-auto-merge.yml), so a new job would
      # be an ungated check until someone edited the ruleset by hand. As a step
      # it inherits the existing `test` context. Placed before the build so a
      # lint failure surfaces without waiting for tsc and vite.
      - run: npm run lint

      # The only gate on the Worker half of the deploy. `tsc` and vitest reach
      # src/worker/image-proxy.ts by relative path, so renaming or moving it —
      # or breaking wrangler.jsonc — leaves lint, build and tests green while
      # deploy-worker.yml starts failing on main. --dry-run needs no
      # credentials, so it runs on every PR including forks. Same
      # step-not-a-job reasoning as the lint step above.
      - run: npm exec --no-install wrangler -- deploy --dry-run

      - run: npm run build
        env:
          VITE_IMAGE_PROXY_URL: ${{ vars.VITE_IMAGE_PROXY_URL }}

      - run: npm test
