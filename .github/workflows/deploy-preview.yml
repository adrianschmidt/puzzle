name: Deploy PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege by default; the job below elevates only what it needs, as in
# dependabot-auto-merge.yml.
permissions:
  contents: read

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Dependabot PRs merge unattended (dependabot-auto-merge.yml) and nothing
    # tests against the dev deploy, so a preview would only clobber the single
    # shared /puzzle/dev/ destination a human PR may be using — and waste a
    # full build per PR. Guard on the PR author, not the actor, so a human
    # closing/reopening a Dependabot PR doesn't deploy either.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}

    # contents for actions-gh-pages' push to gh-pages, pull-requests for the
    # preview-URL comment. Both reach the token through the Actions runtime —
    # actions-gh-pages via its explicit `github_token` input, github-script via
    # its `${{ github.token }}` default — rather than through .git/config.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same as deploy.yml: neither actions-gh-pages nor github-script
          # below reads this checkout's .git/config — each gets the token from
          # the runtime instead. A persisted one would only be exposure,
          # readable by every binary `npm ci` and the build execute, and this
          # job's is `contents: write` plus `pull-requests: write`.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps

      # Same check as deploy.yml, which carries the full reasoning. Worth
      # having on both: the preview at /puzzle/dev/ is the surface PRs are
      # actually reviewed on, so a misconfigured proxy shows up here first —
      # and during a key rotation every preview would otherwise lose its
      # picker with a green checks summary.
      - name: Check the image proxy is configured
        env:
          VITE_IMAGE_PROXY_URL: ${{ vars.VITE_IMAGE_PROXY_URL }}
        run: |
          if [ -z "$VITE_IMAGE_PROXY_URL" ]; then
            echo "::warning::VITE_IMAGE_PROXY_URL is not set — the preview will have NO photo picker."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${VITE_IMAGE_PROXY_URL%/}/download" || true)
          case "$status" in
            400) echo "Image proxy is live, routed, and has a key set (key validity not checked)." ;;
            500) echo "::warning::Image proxy answered 500 — its UNSPLASH_ACCESS_KEY secret is probably unset." ;;
            *)   echo "::warning::Image proxy at $VITE_IMAGE_PROXY_URL answered $status, expected 400 — wrong, undeployed, or route-mounted Worker?" ;;
          esac

      - run: npm run build
        env:
          VITE_BASE_PATH: /puzzle/dev/
          VITE_IMAGE_PROXY_URL: ${{ vars.VITE_IMAGE_PROXY_URL }}
          VITE_APP_VERSION: "PR #${{ github.event.pull_request.number }} (run ${{ github.run_number }})"
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: dev
          keep_files: true

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = 'https://adrianschmidt.github.io/puzzle/dev/';
            const body = `🧩 **Preview deployed:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('Preview deployed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
