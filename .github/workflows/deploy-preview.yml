name: Deploy PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege by default; each job below declares the scope it needs, as in
# dependabot-auto-merge.yml.
permissions:
  contents: read

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  # Split from `deploy` so the npm dependency tree and the write token never
  # share a job — see deploy.yml's `build` job for the mechanism (#524). The
  # stakes are higher here than on main: the sibling also holds
  # `pull-requests: write`, and the dependency tree is a PR author's.
  build:
    runs-on: ubuntu-latest
    # Dependabot PRs merge unattended (dependabot-auto-merge.yml) and nothing
    # tests against the dev deploy, so a preview would only clobber the single
    # shared /puzzle/dev/ destination a human PR may be using — and waste a
    # full build per PR. Guard on the PR author, not the actor, so a human
    # closing/reopening a Dependabot PR doesn't deploy either.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here runs a git operation, so the token this would
          # otherwise leave in .git/config is pure exposure — readable by every
          # npm binary the job goes on to execute.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Same check as deploy.yml, which carries the full reasoning. Worth
      # having on both: the preview at /puzzle/dev/ is the surface PRs are
      # actually reviewed on, so a misconfigured proxy shows up here first —
      # and during a key rotation every preview would otherwise lose its
      # picker with a green checks summary.
      - name: Check the image proxy is configured
        env:
          VITE_IMAGE_PROXY_URL: ${{ vars.VITE_IMAGE_PROXY_URL }}
        run: |
          if [ -z "$VITE_IMAGE_PROXY_URL" ]; then
            echo "::warning::VITE_IMAGE_PROXY_URL is not set — the preview will have NO photo picker."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${VITE_IMAGE_PROXY_URL%/}/download" || true)
          case "$status" in
            400) echo "Image proxy is live, routed, and has a key set (key validity not checked)." ;;
            500) echo "::warning::Image proxy answered 500 — its UNSPLASH_ACCESS_KEY secret is probably unset." ;;
            *)   echo "::warning::Image proxy at $VITE_IMAGE_PROXY_URL answered $status, expected 400 — wrong, undeployed, or route-mounted Worker?" ;;
          esac

      - run: npm run build
        env:
          VITE_BASE_PATH: /puzzle/dev/
          VITE_IMAGE_PROXY_URL: ${{ vars.VITE_IMAGE_PROXY_URL }}
          VITE_APP_VERSION: "PR #${{ github.event.pull_request.number }} (run ${{ github.run_number }})"
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}

      # `include-hidden-files` explained on deploy.yml's equivalent step.
      - name: Upload the built preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Repeated rather than relying on the `needs` cascade: this is the
    # condition that keeps a write token away from Dependabot's PRs, and a
    # reader of this job should not have to infer it from the job above.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}

    # Both elevated scopes sit in the job that executes no dependency tree: no
    # checkout, no npm, no `run:` step. contents for actions-gh-pages' push to
    # gh-pages, pull-requests for the preview-URL comment. See deploy.yml's
    # `deploy` job for what the split does and does not bound.
    permissions:
      contents: write
      pull-requests: write

    steps:
      # No checkout needed — see deploy.yml. github-script reads the PR number
      # from the event payload.
      - name: Download the built preview
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview
          path: dist

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: dev
          keep_files: true

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = 'https://adrianschmidt.github.io/puzzle/dev/';
            const body = `🧩 **Preview deployed:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('Preview deployed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
