name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Least privilege by default; the job below elevates only what it needs, as in
# dependabot-auto-merge.yml. Kept at workflow level so a second job added here
# later — a smoke check, a split-out build — does not inherit a write token by
# default.
permissions:
  contents: read

concurrency:
  group: pages-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # actions-gh-pages pushes to gh-pages with this same job token, handed to
    # it explicitly as `github_token` rather than read from .git/config.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job does push, but not from here: actions-gh-pages below
          # builds its own remote URL from its `github_token` input and works
          # in a clone of its own, never reading this checkout's .git/config.
          # So the token persisted there would only sit where `npm ci` and the
          # build can read it — and unlike ci.yml's, it is `contents: write` on
          # `main`.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      # GitHub substitutes an empty string for an undefined variable, so an
      # unset or renamed VITE_IMAGE_PROXY_URL would otherwise publish a fully
      # green deploy whose only symptom is the photo picker silently gone.
      # Being set is not the same as reaching a live, keyed Worker. Renaming
      # `name` in wrangler.jsonc creates a second Worker at a new URL while
      # this variable still points at the old one, and a missing
      # `wrangler secret put` leaves the Worker answering 500 on every request.
      # Both look identical to a player: the picker quietly does nothing.
      #
      # Probes /download with no `url`, not an unrouted path: a 404 is what
      # every host on the internet returns for a path it doesn't know, so it
      # cannot tell our Worker from a deleted one, an unrelated host, or a
      # Worker mounted behind a route prefix. A 400 from this exact path is
      # ours. Neither reaches upstream, so both cost zero Unsplash quota.
      #
      # It cannot check that the key WORKS — only that one is set — because
      # that would need a real /random call, spending quota on every deploy.
      # Say so, rather than implying more. Warns rather than fails: a
      # transient Cloudflare blip must not block a site deploy, which is also
      # why curl's failure is swallowed (it already prints 000 itself; without
      # `|| true` the non-zero exit would abort this step under `bash -e`).
      - name: Check the image proxy is configured
        env:
          VITE_IMAGE_PROXY_URL: ${{ vars.VITE_IMAGE_PROXY_URL }}
        run: |
          if [ -z "$VITE_IMAGE_PROXY_URL" ]; then
            echo "::warning::VITE_IMAGE_PROXY_URL is not set — deploying WITHOUT the photo picker."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${VITE_IMAGE_PROXY_URL%/}/download" || true)
          case "$status" in
            400) echo "Image proxy is live, routed, and has a key set (key validity not checked)." ;;
            500) echo "::warning::Image proxy answered 500 — its UNSPLASH_ACCESS_KEY secret is probably unset." ;;
            *)   echo "::warning::Image proxy at $VITE_IMAGE_PROXY_URL answered $status, expected 400 — wrong, undeployed, or route-mounted Worker?" ;;
          esac

      - run: npm run build
        env:
          VITE_IMAGE_PROXY_URL: ${{ vars.VITE_IMAGE_PROXY_URL }}
          VITE_APP_VERSION: "#${{ github.run_number }}"
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: true
