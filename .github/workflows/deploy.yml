name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Least privilege by default; each job below declares the scope it needs, as in
# dependabot-auto-merge.yml.
permissions:
  contents: read

concurrency:
  group: pages-prod
  cancel-in-progress: true

jobs:
  # Split from `deploy` so the npm dependency tree and the write token never
  # share a job (#524). Every action a job references is downloaded during
  # "Set up job", before step 1 — so in a combined job, actions-gh-pages'
  # JavaScript is already on disk under the same `runner` user by the time a
  # package's postinstall runs, and the runner executes it a few steps later
  # with the token in its environment. Pinning to a SHA does not close that:
  # the tampering is with the local copy, after download.
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here runs a git operation, so the token this would
          # otherwise leave in .git/config is pure exposure — readable by every
          # npm binary the job goes on to execute.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # GitHub substitutes an empty string for an undefined variable, so an
      # unset or renamed VITE_IMAGE_PROXY_URL would otherwise publish a fully
      # green deploy whose only symptom is the photo picker silently gone.
      # Being set is not the same as reaching a live, keyed Worker. Renaming
      # `name` in wrangler.jsonc creates a second Worker at a new URL while
      # this variable still points at the old one, and a missing
      # `wrangler secret put` leaves the Worker answering 500 on every request.
      # Both look identical to a player: the picker quietly does nothing.
      #
      # Probes /download with no `url`, not an unrouted path: a 404 is what
      # every host on the internet returns for a path it doesn't know, so it
      # cannot tell our Worker from a deleted one, an unrelated host, or a
      # Worker mounted behind a route prefix. A 400 from this exact path is
      # ours. Neither reaches upstream, so both cost zero Unsplash quota.
      #
      # It cannot check that the key WORKS — only that one is set — because
      # that would need a real /random call, spending quota on every deploy.
      # Say so, rather than implying more. Warns rather than fails: a
      # transient Cloudflare blip must not block a site deploy, which is also
      # why curl's failure is swallowed (it already prints 000 itself; without
      # `|| true` the non-zero exit would abort this step under `bash -e`).
      - name: Check the image proxy is configured
        env:
          VITE_IMAGE_PROXY_URL: ${{ vars.VITE_IMAGE_PROXY_URL }}
        run: |
          if [ -z "$VITE_IMAGE_PROXY_URL" ]; then
            echo "::warning::VITE_IMAGE_PROXY_URL is not set — deploying WITHOUT the photo picker."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${VITE_IMAGE_PROXY_URL%/}/download" || true)
          case "$status" in
            400) echo "Image proxy is live, routed, and has a key set (key validity not checked)." ;;
            500) echo "::warning::Image proxy answered 500 — its UNSPLASH_ACCESS_KEY secret is probably unset." ;;
            *)   echo "::warning::Image proxy at $VITE_IMAGE_PROXY_URL answered $status, expected 400 — wrong, undeployed, or route-mounted Worker?" ;;
          esac

      - run: npm run build
        env:
          VITE_IMAGE_PROXY_URL: ${{ vars.VITE_IMAGE_PROXY_URL }}
          VITE_APP_VERSION: "#${{ github.run_number }}"
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}

      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          # actions-gh-pages copies publish_dir with `readdir`, which yields
          # dotfiles, so anything hidden in dist has always been published.
          # upload-artifact excludes them by default, so without this the
          # artifact hop would quietly narrow what ships.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # The elevated scope sits in the job that executes no dependency tree: no
    # checkout, no npm, no `run:` step. That list is the guarantee — this job
    # still runs actions-gh-pages, which is third-party and is what holds the
    # token.
    #
    # What it does NOT bound: `build` still decides the bytes in dist and this
    # job publishes them unexamined. The split narrows a compromised dependency
    # from `contents: write` on the repo to the site's own content.
    permissions:
      contents: write

    steps:
      # No checkout needed: actions-gh-pages resolves a relative `publish_dir`
      # against $GITHUB_WORKSPACE, which the runner creates regardless, and
      # clones gh-pages into a work dir of its own under $HOME.
      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: true
