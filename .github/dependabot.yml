version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Let new releases soak before we take them, so a malicious version is
    # likely to be found and pulled before we ever open a PR for it. Security
    # updates for known CVEs bypass the cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      bezier:
        patterns:
          - "bezier-js"
          - "@types/bezier-js"
      vite:
        patterns:
          - "vite"
          - "vite-plugin-pwa"
          - "@vitejs/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # oxlint-tsgolint embeds a specific TypeScript release rather than
      # resolving the one in this package.json — 7.0.2001 is TS 7.0.2, matching
      # the `typescript` pin.
      #
      # Grouping BATCHES whatever members have an update in the same run; it
      # does not hold a lone `typescript` bump until tsgolint ships a matching
      # release, so it cannot guarantee the two stay in step. What it buys is
      # that when both do move together they land in one PR instead of two
      # racing ones. Both carry `~`, so drift is bounded to the same TS
      # minor rather than to a single patch — the linter's embedded compiler
      # can sit a few 7.0.x patches from the one `tsc` uses. An exact pin would
      # fight the unattended merges this repo relies on, and any behavioural
      # consequence turns the required `test` check red.
      typescript:
        patterns:
          - "typescript"
          - "oxlint"
          - "oxlint-tsgolint"
          - "@oxlint/*"
          - "@oxlint-tsgolint/*"
      workbox:
        patterns:
          - "workbox-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Same soak rationale as the npm block; security updates bypass this too.
    # No 14-day major hold here: the semver-*-days keys are only supported for
    # semver ecosystems (npm etc.), not github-actions — default-days is the
    # only knob available.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "actions/*"
